<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Registry System</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <header>
        <h1>Hospital Registry System</h1>
        <nav>
            <a href="../index.html">Back to Portfolio</a>
        </nav>
    </header>

    <main>
        <section id="register">
            <h2 id="formTitle">Register New Patient</h2>
            <form id="patientForm">
                <input type="hidden" id="editIndex" value="-1">
                <label for="name">Name:</label>
                <input type="text" id="name" required>

                <label for="age">Age:</label>
                <input type="number" id="age" required>

                <label for="condition">Condition:</label>
                <input type="text" id="condition" required>

                <button type="submit" id="submitBtn">Register</button>
                <button type="button" id="cancelBtn" style="display:none;">Cancel</button>
            </form>
        </section>

        <section id="registry">
            <h2>Patient Registry</h2>
            <div id="filters">
                <input type="text" id="search" placeholder="Search by name...">
                <input type="number" id="ageMin" placeholder="Min Age">
                <input type="number" id="ageMax" placeholder="Max Age">
                <input type="text" id="conditionFilter" placeholder="Filter by condition">
                <button id="clearFilters">Clear Filters</button>
            </div>
            <ul id="patientList"></ul>
        </section>

        <section id="analysis">
            <h2>Data Analysis</h2>
            <canvas id="ageChart"></canvas>
            <canvas id="conditionChart"></canvas>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
